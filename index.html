<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Peace Park Command</title>
    <style>
        :root {
            --park-green: #2e7d32;
            --dirt-brown: #5d4037;
            --clay: #d84315;
            --text-light: #ffffff;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #1a1a1a;
            color: var(--text-light);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { font-size: 1.2rem; color: #81c784; margin-bottom: 10px; text-align: center; }
        
        /* Navigation */
        .nav { display: flex; gap: 10px; margin-bottom: 15px; width: 100%; }
        .nav-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            background: var(--park-green);
            color: white;
            font-weight: bold;
            font-size: 0.8rem;
        }

        /* Grid System */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            width: 100%;
            max-width: 400px;
        }
        .bed {
            aspect-ratio: 1/1;
            background-color: var(--dirt-brown);
            border: 2px solid #3e2723;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            position: relative;
            transition: transform 0.1s;
        }
        .bed:active { transform: scale(0.95); background-color: var(--park-green); }
        .bed-num { font-weight: bold; margin-bottom: 2px; }
        .status-dot {
            width: 8px;
            height: 8px;
            background: #4caf50;
            border-radius: 50%;
            margin-top: 4px;
        }

        /* Screens */
        .screen { display: none; width: 100%; max-width: 400px; }
        .screen.active { display: block; }
        .back-btn {
            background: #444;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            margin-bottom: 15px;
        }

        /* Forms */
        .box {
            background: #2c2c2c;
            padding: 15px;
            border-radius: 10px;
            border-left: 4px solid var(--park-green);
        }
        textarea, select {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            background: #3d3d3d;
            border: 1px solid #555;
            color: white;
            border-radius: 5px;
            box-sizing: border-box;
        }
        .send-btn {
            width: 100%;
            padding: 12px;
            background: #1976d2;
            color: white;
            border: none;
            border-radius: 5px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>PHILLY PEACE PARK<br>Mobile Command Grid</h1>

    <div id="h" class="screen active">
        <div class="nav">
            <button class="nav-btn" onclick="show('f')">🧊 Fridge</button>
            <button class="nav-btn" onclick="show('p')">🛡️ Patrol</button>
        </div>
        
        <div class="grid-container" id="grid">
            </div>
    </div>

    <div id="f" class="screen">
        <button class="back-btn" onclick="show('h')">← Back</button>
        <div class="box">
            <h3>🥦 Fridge Status</h3>
            <select id="fS">
                <option>Clean & Stocked</option>
                <option>Needs Cleaning</option>
                <option>Low on Food</option>
            </select>
            <textarea id="fN" placeholder="What items were added? Any issues?"></textarea>
            <button class="send-btn" onclick="send('Fridge')">📧 SEND FRIDGE REPORT</button>
        </div>
    </div>

    <div id="p" class="screen">
        <button class="back-btn" onclick="show('h')">← Back</button>
        <div class="box">
            <h3>🇵🇸 Security Patrol</h3>
            <textarea id="pN" placeholder="Note any property damage, unusual activity, or supply needs..."></textarea>
            <button class="send-btn" onclick="send('Security')">📧 SEND PATROL REPORT</button>
        </div>
    </div>

    <script>
        // Generate 21 Beds
        const grid = document.getElementById('grid');
        for (let i = 1; i <= 21; i++) {
            const bed = document.createElement('div');
            bed.className = 'bed';
            bed.innerHTML = `<span class="bed-num">BED ${i}</span><div class="status-dot"></div>`;
            bed.onclick = () => alert(`Bed ${i} selected for maintenance.`);
            grid.appendChild(bed);
        }

        // Navigation
        function show(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            window.scrollTo(0,0);
        }

        // Email Function
        function send(type) {
            let body = "";
            if(type === 'Fridge') {
                body = `Status: ${document.getElementById('fS').value}%0D%0ANotes: ${document.getElementById('fN').value}`;
            } else {
                body = `Patrol Notes: ${document.getElementById('pN').value}`;
            }
            window.location.href = `mailto:illzwillz@gmail.com?subject=${type} Report - Peace Park&body=${body}`;
        }
    </script>
</body>
</html>
